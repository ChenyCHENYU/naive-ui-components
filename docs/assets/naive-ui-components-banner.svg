<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">Robot Naive UI Components</title>
  <desc id="description">55 Vue 3 business components. Typed configuration, independent component entries and scoped styles, in the Robot ecosystem.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1C19"/><stop offset="1" stop-color="#102B24"/>
    </linearGradient>
    <linearGradient id="tile" x1="8" y1="4" x2="120" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#249D70"/><stop offset="1" stop-color="#0C5E47"/>
    </linearGradient>
    <linearGradient id="shine" x1="20" y1="0" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF" stop-opacity=".16"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A7F3CB" stroke-opacity=".035"/>
    </pattern>
    <radialGradient id="glow">
      <stop stop-color="#49CF91" stop-opacity=".13"/><stop offset="1" stop-color="#49CF91" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bounds"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="420" fill="url(#background)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <ellipse cx="1080" cy="150" rx="340" ry="270" fill="url(#glow)"/>
    <path d="M64 326H1216" stroke="#94B5A5" stroke-opacity=".18"/>
    <!-- Robot family R mark; the detached tile represents independent components. -->
    <svg x="60" y="112" width="130" height="130" viewBox="0 0 128 128">
      <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#tile)"/>
      <rect x="2.5" y="2.5" width="123" height="123" rx="29.5" fill="url(#shine)" stroke="#FFF" stroke-opacity=".2"/>
      <path d="M35 99V35H69C86 35 96 44 96 60C96 72 90 80 81 83L99 99H78L61 85H51V99H35ZM51 51V69H68C75 69 79 66 79 60C79 54 75 51 68 51H51Z" fill="#F2FFF7"/>
      <path d="M66 34V28" stroke="#F2FFF7" stroke-width="4" stroke-linecap="round"/>
      <circle cx="66" cy="23" r="4" fill="#A7F3CB"/>
      <rect x="55" y="56" width="5" height="7" rx="2.5" fill="#64D8A0"/>
      <rect x="67" y="56" width="5" height="7" rx="2.5" fill="#64D8A0"/>
      <rect x="103" y="99" width="21" height="21" rx="6" fill="#B5F5D3" stroke="#0C5E47" stroke-width="3"/>
    </svg>
    <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
      <text x="64" y="62" fill="#8BAE9E" font-size="12" font-weight="600" letter-spacing="2.4">ROBOT ECOSYSTEM / COMPONENT LIBRARY</text>
      <text x="224" y="155" fill="#F2FFF7" font-size="52" font-weight="750" letter-spacing="-1.8">Naive UI Components</text>
      <text x="227" y="196" fill="#B4CFC1" font-size="18">Business interfaces, composed with confidence.</text>
      <text x="227" y="234" fill="#72DDA6" font-size="15" font-family="SFMono-Regular,Consolas,monospace">@robot-admin/naive-ui-components</text>
      <text x="227" y="278" fill="#809F90" font-size="13">Forms · Tables · Editors · Workflow · Media</text>
      <g font-size="12" font-weight="600" letter-spacing="1.4">
        <text x="64" y="369" fill="#A7F3CB">55 COMPONENTS</text>
        <text x="318" y="369" fill="#AFC9BC">VUE 3 + TYPESCRIPT</text>
        <text x="633" y="369" fill="#AFC9BC">PER-COMPONENT IMPORTS</text>
        <text x="1018" y="369" fill="#AFC9BC">OPEN SOURCE / MIT</text>
      </g>
    </g>
    <!-- A composition of a form, a table and a flow; an illustration, not an application screenshot. -->
    <g transform="translate(936 88)" stroke="#5C9D7F" stroke-width="1.3">
      <path d="M70 84H96V50H140M96 50V156H154" fill="none" stroke="#72DDA6" stroke-opacity=".5"/>
      <rect x="0" y="0" width="120" height="144" rx="12" fill="#112E25"/>
      <path d="M0 29H120" stroke-opacity=".5"/>
      <g fill="#83B79D" stroke="none"><circle cx="14" cy="15" r="2"/><circle cx="22" cy="15" r="2"/><circle cx="30" cy="15" r="2"/></g>
      <g fill="#153C2F" stroke="#416B56"><rect x="16" y="45" width="88" height="20" rx="4"/><rect x="16" y="77" width="88" height="20" rx="4"/></g>
      <rect x="60" y="111" width="44" height="17" rx="4" fill="#64D8A0" stroke="none"/>
      <path d="M23 55H62M23 87H77" stroke="#81AA94" stroke-linecap="round"/>
      <rect x="146" y="-13" width="122" height="101" rx="12" fill="#183C2E"/>
      <path d="M146 14H268M146 39H268M146 63H268M183 14V88M224 14V88" stroke-opacity=".45"/>
      <rect x="159" y="-1" width="44" height="4" rx="2" fill="#8ACBA8" stroke="none"/>
      <g fill="#73DFA7" stroke="none"><rect x="157" y="23" width="14" height="5" rx="2"/><rect x="193" y="48" width="20" height="5" rx="2"/><rect x="235" y="72" width="20" height="5" rx="2"/></g>
      <rect x="145" y="123" width="114" height="96" rx="12" fill="#112E25"/>
      <path d="M202 149V184M175 184H229" fill="none" stroke="#72DDA6" stroke-opacity=".7"/>
      <g fill="#285B42" stroke="#72DDA6"><rect x="187" y="139" width="30" height="19" rx="4"/><rect x="162" y="178" width="27" height="19" rx="4"/><rect x="216" y="178" width="27" height="19" rx="4"/></g>
    </g>
  </g>
</svg>
